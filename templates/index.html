<!doctype html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f9">
<title>Darren's Finance</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body{% if guest %} data-guest="1"{% endif %}>
<div id="boot" role="status" aria-label="Loading"><div class="spin"></div><div class="lt">Loading your finances</div></div>
<aside>
  <div class="brand">darren's <span>finance</span></div>
  <label>Pay cycle</label>
  <select id="cycleSel"></select>
  <nav class="navs" aria-label="Main">
    <button class="nav" data-t="dash">Dashboard</button>
    <button class="nav" data-t="wealth">Wealth</button>
    <button class="nav" data-t="spend">Spending</button>
    <button class="nav" data-t="cycles">Pay cycles</button>
  </nav>
  {% if can_logout %}
  <form class="side-foot" method="post" action="{{ url_for('logout') }}">
    <button class="logout" type="submit">{{ 'Exit demo' if guest else 'Log out' }}</button>
  </form>
  {% endif %}
</aside>
<main><div class="wrap">
  {% if guest %}<div class="note"><span class="ni">ⓘ</span><div><b>Demo mode.</b> All numbers are random and nothing is saved. Refresh the page to get a new set of data.</div></div>{% endif %}
  <div class="top"><div><div class="greet" id="greet"></div><div class="titlerow"><h1 id="title"></h1><button id="eye" class="eye" type="button" onclick="toggleEye()"></button></div></div></div>
  <div id="view"></div>
</div></main>

<script src="{{ url_for('static', filename='js/icons.js') }}"></script>
<script src="{{ url_for('static', filename='js/demo.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
